name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            .github/workflows/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix .github/workflows

      - name: Build Application
        run: npm run build --prefix .github/workflows

  test_stage:
    needs: build_stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            .github/workflows/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix .github/workflows

      - name: Run Tests
        run: npm test --prefix .github/workflows
